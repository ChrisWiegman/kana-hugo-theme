kind: Features
body: 'Publish agent discovery files, each opt-in through outputs.home: an Agentic Resource Discovery manifest ("ard") at /.well-known/ard.json and /.well-known/ai-catalog.json listing the site''s machine-readable resources, with an Agentmap line in robots.txt and rel="ard" links; an RFC 9727 API catalog ("apicatalog") at /.well-known/api-catalog with an OpenAPI 3.1 description of the read-only static endpoints at /openapi.json; and a website-only Personal Agent Protocol declaration ("poppy") at /.well-known/poppy.json. Add other resources to the manifest with params.ard.entries.'
