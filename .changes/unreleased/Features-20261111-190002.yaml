kind: Features
body: Add a read-only MCP server for Cloudflare Workers (workers/mcp.mjs) with search_site, list_recent_posts, and get_page tools answered from the site's static files, and an "mcpcard" output that publishes its MCP Server Card at /.well-known/mcp/server-card.json and lists it in the ARD manifest and agent skill. Search index entries now include kind ("post" or "page").
