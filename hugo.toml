[module]
  [module.hugoVersion]
    extended = true
    min = "0.169.0"

[params]
  imageSizes = [1700, 1420, 850, 710, 600, 300]
  imageFormats = ["avif", "webp"]
  imageSizeString = "(max-width: 882px) calc(100vw - 2rem), 850px"

# Output formats used for AI and agent discovery. Sites that define their own
# [outputs] must add "llms"/"llmsfull"/"agentskills"/"ard"/"apicatalog"/"poppy"
# /"mcpcard"/"agentcard" to home and "markdown" to page to use them.
[mediaTypes."application/linkset+json"]
  suffixes = []

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true
  permalinkable = true

[outputFormats.llmsfull]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true
  notAlternative = true
  permalinkable = true

[outputFormats.agentskills]
  mediaType = "application/json"
  baseName = "index"
  path = ".well-known/agent-skills"
  isPlainText = true
  notAlternative = true
  permalinkable = true

# Agentic Resource Discovery manifest; also publishes ai-catalog.json.
[outputFormats.ard]
  mediaType = "application/json"
  baseName = "ard"
  path = ".well-known"
  isPlainText = true
  notAlternative = true
  permalinkable = true

# RFC 9727 API catalog (extensionless); also publishes /openapi.json.
[outputFormats.apicatalog]
  mediaType = "application/linkset+json"
  baseName = "api-catalog"
  path = ".well-known"
  isPlainText = true
  notAlternative = true
  permalinkable = true

[outputFormats.poppy]
  mediaType = "application/json"
  baseName = "poppy"
  path = ".well-known"
  isPlainText = true
  notAlternative = true
  permalinkable = true

# MCP Server Card for the Worker in workers/agents.mjs; only enable it with the
# Worker deployed at /mcp.
[outputFormats.mcpcard]
  mediaType = "application/json"
  baseName = "server-card"
  path = ".well-known/mcp"
  isPlainText = true
  notAlternative = true
  permalinkable = true

# A2A Agent Card for the Worker in workers/agents.mjs; only enable it with
# the Worker deployed at /a2a.
[outputFormats.agentcard]
  mediaType = "application/json"
  baseName = "agent-card"
  path = ".well-known"
  isPlainText = true
  notAlternative = true
  permalinkable = true

[outputs]
  home = ["html", "rss", "json", "llms", "llmsfull", "agentskills", "ard", "apicatalog", "poppy", "mcpcard", "agentcard"]
  page = ["html", "markdown"]
