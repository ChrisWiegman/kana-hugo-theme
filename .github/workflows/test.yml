name: Run End-to-end tests with Playwright

on:
    push:
        branches: ["**"]
    workflow_call:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node (with npm cache)
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                # Keep in sync with min_version in theme.toml.
                hugo: ["0.169.0"]

        name: test (Hugo ${{ matrix.hugo }})

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Hugo
              env:
                  HUGO_VERSION: ${{ matrix.hugo }}
              run: |
                  wget -q -O /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
                  tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
                  hugo version

            - name: Cache Hugo resources
              uses: actions/cache@v5
              with:
                  path: |
                      dev/resources
                  key: ${{ runner.os }}-hugo-${{ matrix.hugo }}-resources-${{ hashFiles('**/go.mod', '**/go.sum', '**/package-lock.json', '**/pnpm-lock.yaml', '**/yarn.lock', 'hugo.toml', 'hugo.yaml', 'hugo.json', 'config/**', 'assets/**') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-${{ matrix.hugo }}-resources-

            - name: Prepare Hugo cache directory
              run: mkdir -p .hugo_cache

            - name: Cache Hugo cacheDir
              uses: actions/cache@v5
              with:
                  path: |
                      .hugo_cache
                  key: ${{ runner.os }}-hugo-${{ matrix.hugo }}-cachedir-${{ hashFiles('**/go.mod', '**/go.sum', 'hugo.toml', 'hugo.yaml', 'hugo.json', 'config/**') }}
                  restore-keys: |
                      ${{ runner.os }}-hugo-${{ matrix.hugo }}-cachedir-

            - name: Set up Node (with npm cache)
              uses: actions/setup-node@v6
              with:
                  node-version: "lts/*"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Prepare Playwright browser cache
              run: mkdir -p ~/.cache/ms-playwright

            - name: Cache Playwright browsers
              uses: actions/cache@v5
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            - name: Setup Playwright for testing
              run: npx playwright install chromium
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright

            - name: Run Playwright tests
              run: npm run e2e:ci
              env:
                  PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
                  HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

            - name: Upload Playwright artifacts on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-artifacts-hugo-${{ matrix.hugo }}
                  path: |
                      test-results
                      playwright-report
