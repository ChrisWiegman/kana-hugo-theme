{{ define "main" }}
<article class="archive">
    <div class="container">
        <div class="content-header">
            <h1 class="post-title p-name">Search results for: <span id="search-term"
                    class="term"></span></h1>
            <p class="description"><span class="post-count" id="search-count"></span> posts found.</p>
        </div>

        {{ partial "form.html" . }}

        {{ partial "results.html" . }}
        <noscript><p>Search requires JavaScript. Please enable JavaScript or <a href="{{ with site.GetPage "/blog" }}{{ .RelPermalink }}{{ else }}{{ site.Home.RelPermalink }}{{ end }}">browse all posts</a>.</p></noscript>
    </div>
</article>

{{ partial "search.html" . }}
{{ end }}
