{{ define "main" }}
<article class="archive">
    <div class="container">
        {{- $pages := .Pages -}}
        <div class="content-header">
            <h1 class="post-title p-name">All posts in: <span id="search-term" class="term">{{ .Title }}</span></h1>
            <p class="description"><span class="post-count">{{ $pages.Len }}</span> posts found.</p>
        </div>
        {{ partial "form.html" . }}
        {{- if eq .Data.Singular "category" -}}
        {{ partial "filter.html" . }}
        {{- end -}}
        {{ partial "posts-grouped.html" $pages }}
    </div>
</article>
{{ end }}
